name: Android production APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  EXPO_NO_DOTENV: '1'
  EXPO_PUBLIC_API_URL: https://api.binzolive.com/api/v1
  EXPO_PUBLIC_SOCKET_URL: https://api.binzolive.com

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: node --test scripts/test-android-release-ci.cjs
      - run: npm run test:native-media
      - run: npm run test:call-performance
      - run: npm run test:facebetter
      - name: Validate workflow syntax and shell commands
        run: docker run --rm -v "$PWD:/work" -w /work rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  build:
    needs: checks
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --no-audit --no-fund
      - name: Check committed version and tag identity
        id: identity
        run: node ci/android-release.cjs metadata
      - name: Install the pinned Android toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"'
      - name: Restore Firebase configuration before prebuild
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: node ci/android-release.cjs firebase
      - run: npm run build:web
      - name: Generate Android with the checked-in native plugins
        run: npx expo prebuild --platform android --clean --no-install
      - name: Bound native build memory and compiler concurrency
        run: node ci/android-release.cjs gradle
      - name: Restore and verify the existing app signing certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: node ci/android-release.cjs keystore
      - name: Build the signed APK with production HTTPS endpoints
        run: npm run build:apk
      - name: Verify signer, package, version, updater and ARM native libraries
        run: node ci/android-release.cjs validate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Remove restored build credentials
        if: always()
        run: node ci/android-release.cjs cleanup

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      APK_ARTIFACT: ${{ needs.build.outputs.artifact_name }}
    steps:
      - name: Download the exact APK that passed validation
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$APK_ARTIFACT" --dir release
      - name: Verify the downloaded APK checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish the version-tag APK on GitHub Releases
        run: gh release create "$GITHUB_REF_NAME" release/*.apk release/*.json release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "BinzoLive $GITHUB_REF_NAME" --generate-notes
      - name: Record publication boundary
        run: echo 'APK published to GitHub Releases. Mandatory in-app rollout remains a separate verified Admin App releases publication.' >> "$GITHUB_STEP_SUMMARY"
