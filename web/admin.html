<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zimi Live Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Desktop admin console: fixed sidebar, content column, side drawer for detail. */
:root{
 --bg:#f6f5f8;--surface:#ffffff;--raised:#f1eff4;--line:#e5e2ea;--ink:#141216;--muted:#66616e;--faint:#9b96a3;
 --accent:#e8117a;--accent-ink:#c40e68;--accent-wash:#ffeaf4;--gold:#c98a00;--gold-wash:#fff4d6;
 --ok:#0f9d7f;--ok-wash:#e2f7f1;--bad:#d92d4b;--bad-wash:#fde8ec;--warn:#b86e00;--warn-wash:#fff2dc;
 --side:#141216;--side-ink:#cfcbd6;--side-faint:#7d7886;
 --display:"Poppins",Inter,system-ui,sans-serif;--body:Inter,system-ui,sans-serif;
 --shadow:0 1px 2px rgb(20 18 22/.05),0 10px 28px -16px rgb(20 18 22/.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0d0c0f;--surface:#17161a;--raised:#201e24;--line:#2c2930;--ink:#f5f3f7;--muted:#a39dab;--faint:#6f6a77;
 --accent:#ff2e93;--accent-ink:#ff5cae;--accent-wash:#2a0a1c;--gold:#ffc02e;--gold-wash:#2a2008;
 --ok:#1bc5a4;--ok-wash:#0d2a23;--bad:#ff5c79;--bad-wash:#2d0f16;--warn:#ffb547;--warn-wash:#2b1d08;
 --side:#09080b;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0d0c0f;--surface:#17161a;--raised:#201e24;--line:#2c2930;--ink:#f5f3f7;--muted:#a39dab;--faint:#6f6a77;
 --accent:#ff2e93;--accent-ink:#ff5cae;--accent-wash:#2a0a1c;--gold:#ffc02e;--gold-wash:#2a2008;
 --ok:#1bc5a4;--ok-wash:#0d2a23;--bad:#ff5c79;--bad-wash:#2d0f16;--warn:#ffb547;--warn-wash:#2b1d08;
 --side:#09080b;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:var(--body);font-size:14px;line-height:1.5;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.tab{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* desktop only */
.mobile-block{display:none}
@media (max-width:1023px){.app,.gate{display:none!important}.mobile-block{display:flex;min-height:100%;align-items:center;justify-content:center;padding:32px 16px;text-align:center}
 .mobile-block div{max-width:340px}.mobile-block h1{font-size:22px;margin:14px 0 6px}.mobile-block p{color:var(--muted)}}
.mark{display:inline-flex;width:40px;height:40px;border-radius:12px;align-items:center;justify-content:center;color:#fff;background:linear-gradient(140deg,#ff2e93,#ffc02e)}

/* sign-in gate */
.gate{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.gate .pane{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(32px,6vw,96px)}
.gate .art{background:radial-gradient(70% 60% at 30% 30%,rgba(255,46,147,.55),transparent 70%),radial-gradient(60% 60% at 80% 80%,rgba(255,192,46,.4),transparent 70%),#141216;color:#fff}
.gate .art h2{font-size:34px;max-width:420px}
.gate .art p{margin-top:12px;max-width:420px;color:rgba(255,255,255,.7)}
.gate form{max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px}
.gate h1{font-size:26px;margin-top:18px}
.gate .sub{color:var(--muted);margin-top:-6px}

/* form bits */
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.in{height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;width:100%}
textarea.in{height:auto;min-height:220px;padding:12px;line-height:1.55;resize:vertical}
select.in{padding-right:8px}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;font-size:13px;font-weight:700;background:var(--raised);color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--accent);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad-wash);color:var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.lg{height:46px;font-size:14px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .mark{width:32px;height:32px;border-radius:10px}
.brand b{font-family:var(--display);font-size:16px;color:#fff}
.brand span{display:block;font-size:11px;color:var(--side-faint)}
.brand .mark{display:inline-flex;color:#fff;font-size:13px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side .grp{margin:14px 10px 6px;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--side-faint)}
.side nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--side-ink);font-size:13.5px;font-weight:600;text-align:left}
.side nav button:hover{background:rgba(255,255,255,.05)}
.side nav button.on{background:rgba(255,46,147,.16);color:#fff}
.side nav button.on svg{color:#ff5cae}
.side nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#ff2e93;color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04)}
.side .me .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,#ff2e93,#ffc02e);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px}
.side .me b{display:block;font-size:13px;color:#fff}.side .me span{font-size:11px;color:var(--side-faint)}
.side .me button{margin-left:auto;color:var(--side-faint);font-size:12px;font-weight:700}
.side{overflow-y:auto}
.viewas{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding:0 4px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--side-faint)}
.viewas select{height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--side-ink);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;padding:0 6px}

.main{min-width:0;padding:26px 32px 48px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.top h1{font-size:24px}
.top p{color:var(--muted);margin-top:3px;max-width:70ch}
.top .acts{display:flex;gap:8px}

/* cards, kpis, tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.kpi{padding:14px 16px}
.kpi span{font-size:11.5px;font-weight:700;color:var(--muted)}
.kpi b{display:block;margin-top:4px;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:11.5px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sec{padding:16px 18px}
.sec h3{font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec h3 button{font-family:var(--body);font-size:12px;font-weight:700;color:var(--accent-ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;text-align:left;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--raised)}
.tbl tr.click{cursor:pointer}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .chk{width:36px}
.tblwrap{overflow-x:auto}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .av{width:30px;height:30px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.who b{display:block;font-weight:700;white-space:nowrap}
.who span{display:block;font-size:11.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-wash);color:var(--ok)}
.p-bad{background:var(--bad-wash);color:var(--bad)}
.p-warn{background:var(--warn-wash);color:var(--warn)}
.p-mute{background:var(--raised);color:var(--muted)}
.p-acc{background:var(--accent-wash);color:var(--accent-ink)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:11px;background:var(--raised);width:max-content}
.tabs button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);min-width:260px;color:var(--muted)}
.search input{border:0;outline:0;background:none;width:100%;font-size:13px;color:var(--ink)}
.bulk{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--accent-wash);border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--accent-ink)}
.bulk .sp{flex:1}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* switch */
.sw{position:relative;width:38px;height:22px;border-radius:99px;background:var(--line);transition:.2s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(16px)}

/* drawer + modal */
.veil{position:fixed;inset:0;background:rgba(10,8,12,.45);z-index:40;animation:fade .15s ease both}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,92vw);z-index:41;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;animation:slide .22s cubic-bezier(.22,.8,.3,1) both}
.drawer header{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{font-size:18px}
.drawer header .av{width:40px;height:40px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff}
.drawer .x{margin-left:auto;width:32px;height:32px;border-radius:8px;font-size:20px;color:var(--muted)}
.drawer .body{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.drawer footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface)}
.modal{position:fixed;z-index:41;top:50%;left:50%;transform:translate(-50%,-50%);width:min(620px,92vw);max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .2s ease both}
.modal header{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:18px}
.modal .body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal .full{grid-column:1/-1}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(30px);opacity:0}}@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}}
@media (prefers-reduced-motion:reduce){.veil,.drawer,.modal{animation:none}}
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.doc{position:relative;aspect-ratio:3/2;border-radius:11px;overflow:hidden;background:linear-gradient(135deg,#3b3240,#1f1a22);display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:11.5px;font-weight:700}
.doc.ph{aspect-ratio:3/4}
.docs.ph{grid-template-columns:repeat(4,1fr)}
.facts{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:13px}
.facts dt{color:var(--muted)}.facts dd{font-weight:600}
.checks{display:flex;flex-direction:column;gap:6px}
.checks div{display:flex;align-items:center;gap:8px;font-size:13px}
.checks .y{color:var(--ok)}.checks .n{color:var(--bad)}.checks .q{color:var(--warn)}
.h4{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* rules */
.rules{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
.rrow b{display:block;font-size:13.5px}.rrow span{display:block;font-size:12px;color:var(--muted)}
.unit{display:flex;align-items:center;gap:6px}
.unit em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.changed{background:var(--gold-wash)}
.ver{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.ver:first-child{border-top:0}
.ver b{font-variant-numeric:tabular-nums}
.ver span{color:var(--muted);font-size:12px}
.ver .pill{margin-left:auto}
.tl .ver .pill{margin-left:0;flex:0 0 auto}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#141216;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 16px 40px -14px rgba(0,0,0,.6);animation:pop2 .2s ease both}
@keyframes pop2{from{opacity:0;transform:translate(-50%,8px)}}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--raised);font-size:12.5px;color:var(--muted)}
.note b{color:var(--ink)}
</style>
</head>

<div id="root"></div>
<script>
/* Zimi Live admin console. Front-end prototype with demo data; every action here
   maps to a backend endpoint that must check the admin's role and write the audit log. */
const IC={

 kyc:'<path d="M12 3.5l7 2.5v5.5c0 4.2-2.8 7.4-7 9-4.2-1.6-7-4.8-7-9V6z" stroke-linejoin="round"/><path d="M9 12l2.2 2.2L15.5 10" stroke-linecap="round" stroke-linejoin="round"/>',

const I=(k,s)=>`<svg viewBox="0 0 24 24" width="${s||17}" height="${s||17}" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">${IC[k]}</svg>`;
const n=v=>Number(v).toLocaleString("en-IN");
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const HUE=["#e8117a","#b86e00","#7a3fd1","#0f9d7f","#d9572b","#2a6fdb"];
const avatar=(nm,i)=>`<span class="av" style="background:${HUE[i%HUE.length]}">${nm.split(" ").map(w=>w[0]).slice(0,2).join("")}</span>`;
const now=()=>new Date().toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});

/* ---------- demo data ---------- */
const NAMES=["Aanya Kapoor","Ishaan Verma","Meher Singh","Rehan Qureshi","Tara Iyer","Noor Sheikh","Kabir Das","Mehak Dhillon","Apsara Rao","Zoya Khan","Sahil Bhatt","Imran Qazi"];
const CITY=["Mumbai","Bengaluru","Chandigarh","Lucknow","Chennai","Hyderabad","Kolkata","Ludhiana","Indore","Delhi","Pune","Jaipur"];
const D={
 kyc:[
  {id:"K-1042",n:"Rohit Sharma",role:"Host",ph:"+91 98765 43210",dob:"14 Mar 1995",idt:"PAN",idno:"ABCPS1234F",sub:"10 min ago",photos:3,flags:[],st:"pending"},

  {id:"K-1039",n:"Sahil Bhatt",role:"Sender",ph:"+91 97000 33445",dob:"30 Nov 1992",idt:"PAN",idno:"BHTPS7781K",sub:"2 hr ago",photos:0,flags:[],st:"pending"},
  {id:"K-1038",n:"Zoya Khan",role:"Host",ph:"+91 98200 11009",dob:"07 Jul 1999",idt:"PAN",idno:"KHAPZ0912M",sub:"3 hr ago",photos:3,flags:["ID number used on another account"],st:"pending"},
  {id:"K-1031",n:"Tara Iyer",role:"Host",ph:"+91 94440 87650",dob:"21 Apr 1987",idt:"Aadhaar",idno:"XXXX XXXX 1180",sub:"Yesterday",photos:3,flags:[],st:"approved"},

 `<div class="kpis"><div class="card kpi"><span>Calls live now</span><b>${n(4120+D.live.length)}</b></div><div class="card kpi"><span>Flagged right now</span><b>${D.live.filter(c=>c.flag).length}</b><em class="down">Needs a look</em></div><div class="card kpi"><span>Average call</span><b>8m 40s</b></div></div>
 <div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Call</th><th>Host</th><th>Sender</th><th class="num">Duration</th><th class="num">Charged</th><th>Flag</th><th></th></tr></thead><tbody>
 ${D.live.map(c=>`<tr><td class="tab">${c.id}</td><td><b>${esc(c.host)}</b></td><td>${esc(c.sender)}</td><td class="num tab">${c.min} min</td><td class="num tab">${n(c.coins)}</td>
  <td>${c.flag?`<span class="pill p-bad"><i></i>${esc(c.flag)}</span>`:`<span class="pill p-mute">None</span>`}</td>
  <td><div style="display:flex;gap:6px"><button class="btn sm bad" onclick="endLive('${c.id}')">End call</button><button class="btn sm ghost" onclick="openUser('${esc(c.host)}')">Host</button></div></td></tr>`).join("")||`<tr><td colspan="7" class="empty">No live calls.</td></tr>`}</tbody></table></div></div>`}
function endLive(id){const c=D.live.find(x=>x.id===id);D.live=D.live.filter(x=>x.id!==id);audit("Ended live call",`${c.id} · ${c.host} and ${c.sender}`);toast(`Call ${c.id} ended. Both people see "This call was ended by Zimi Live".`)}

/* ---------- refunds ---------- */
function vRefunds(){
 return head("Refunds","Failed or duplicate recharges. Refunds go back to the original payment method; coins are removed if they were credited.")+
 `<div class="card"><div class="bar"><label class="search">${I("srch",15)}<input id="ordq" placeholder="Look up an order ID, e.g. ORD-55120" aria-label="Order ID" onkeydown="if(event.key==='Enter')findOrder()"></label><button class="btn" onclick="findOrder()">Find order</button></div>
 <div class="tblwrap"><table class="tbl"><thead><tr><th>Order</th><th>User</th><th class="num">Amount</th><th class="num">Coins</th><th>What happened</th><th>Age</th><th></th></tr></thead><tbody>
 ${D.refunds.map(r=>`<tr id="row-${r.id}"><td class="tab">${r.id}</td><td>${esc(r.n)}</td><td class="num tab"><b>₹${r.inr.toFixed(2)}</b></td><td class="num tab">${n(r.coins)}</td><td>${esc(r.gw)}</td><td style="color:var(--muted)">${r.age}</td>
  <td>${r.st==="open"?`<button class="btn sm ok" onclick="refund('${r.id}')">Refund</button>`:`<span class="pill p-ok"><i></i>Refunded</span>`}</td></tr>`).join("")}</tbody></table></div></div>`}
function findOrder(){const q=(document.getElementById("ordq").value||"").trim().toUpperCase(),r=D.refunds.find(x=>x.id===q);
 if(!r){toast(q?`No order ${q} found`:"Enter an order ID");return}const el=document.getElementById("row-"+r.id);el.scrollIntoView({block:"center"});el.style.background="var(--gold-wash)"}
function refund(id){const r=D.refunds.find(x=>x.id===id);r.st="refunded";audit("Refunded order",`${r.id} · ₹${r.inr} to ${r.n}`);toast(`₹${r.inr.toFixed(2)} refunded to ${r.n}`)}

/* ---------- reconciliation ---------- */
const inr=v=>"₹"+n(Math.round(v));
function csv(name,rows){const t=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download=name;a.click();toast(`${name} downloaded`)}catch(e){toast("Download blocked in this preview")}}
function vRecon(){const R=D.recon;
 return head("Reconciliation","Money in and out per day. Every rupee of coins sold should equal call charges, gifts and fees kept, plus coins still in wallets. Any gap is flagged.",
  `<button class="btn" onclick="csv('reconciliation.csv',[['Day','Coins sold','Call charges','Gifts','Entry fees kept','Payouts','Gap']].concat(D.recon.map(r=>[r.day,r.sold,r.calls,r.gifts,r.fees,r.paid,r.diff])))">Export CSV</button>`)+
 `<div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Day</th><th class="num">Coins sold</th><th class="num">Call charges</th><th class="num">Gifts</th><th class="num">Entry fees kept</th><th class="num">Payouts</th><th>Check</th></tr></thead><tbody>
 ${R.map(r=>`<tr><td><b>${r.day}</b></td><td class="num tab">${inr(r.sold)}</td><td class="num tab">${inr(r.calls)}</td><td class="num tab">${inr(r.gifts)}</td><td class="num tab">${inr(r.fees)}</td><td class="num tab">${inr(r.paid)}</td>
  <td>${r.diff?`<span class="pill p-bad"><i></i>Gap ${inr(r.diff)}</span>`:`<span class="pill p-ok"><i></i>Balanced</span>`}</td></tr>`).join("")}</tbody></table></div></div>`}
/* ---------- coin packs & gift catalogue ---------- */
function vPacks(){
 return head("Coin packs","What senders see on the Add coins page. Price changes apply to new purchases only.",`<button class="btn pri" onclick="D.packs.push({id:D.packs.length+1,coins:1000,price:399,bonus:100,tag:'',on:0});audit('Added coin pack','1,000 coins');render()">${I("plus",15)} Add pack</button>`)+
 `<div class="card"><table class="tbl"><thead><tr><th class="num">Coins</th><th class="num">Price (₹)</th><th class="num">Bonus %</th><th>Tag</th><th>Live</th></tr></thead><tbody>
 ${D.packs.map(p=>`<tr><td class="num"><input class="in tab" style="width:110px;height:34px;text-align:right" type="number" value="${p.coins}" onchange="setPack(${p.id},'coins',+this.value)" aria-label="Coins"></td>
  <td class="num"><input class="in tab" style="width:110px;height:34px;text-align:right" type="number" step="0.01" value="${p.price}" onchange="setPack(${p.id},'price',+this.value)" aria-label="Price"></td>
  <td class="num"><input class="in tab" style="width:80px;height:34px;text-align:right" type="number" value="${p.bonus}" onchange="setPack(${p.id},'bonus',+this.value)" aria-label="Bonus"></td>
  <td><select class="in" style="width:130px;height:34px" onchange="setPack(${p.id},'tag',this.value)">${["","Hot","Popular","Best value"].map(t=>`<option ${p.tag===t?"selected":""} value="${t}">${t||"None"}</option>`).join("")}</select></td>
  <td><button class="sw ${p.on?"on":""}" role="switch" aria-checked="${!!p.on}" aria-label="Pack live" onclick="setPack(${p.id},'on',${p.on?0:1})"></button></td></tr>`).join("")}</tbody></table></div>`}
function setPack(id,k,v){const p=D.packs.find(x=>x.id===id);p[k]=v;audit("Edited coin pack",`${n(p.coins)} coins · ${k}`);toast("Coin pack updated");}
function vGifts(){
 return head("Gift catalogue","Gifts in the call tray and chat. Turning a gift off hides it immediately; its price stays on past receipts.",`<button class="btn pri" onclick="D.gifts.push({id:D.gifts.length+1,nm:'New gift',e:'🎁',p:499,t:'Common',on:0});audit('Added gift','New gift');render()">${I("plus",15)} Add gift</button>`)+
 `<div class="card"><table class="tbl"><thead><tr><th>Gift</th><th>Name</th><th class="num">Price (coins)</th><th>Tier</th><th>Live</th></tr></thead><tbody>
 ${D.gifts.map(gf=>`<tr><td style="font-size:26px">${gf.e}</td><td><input class="in" style="width:180px;height:34px" value="${esc(gf.nm)}" onchange="setGift(${gf.id},'nm',this.value)" aria-label="Gift name"></td>
  <td class="num"><input class="in tab" style="width:120px;height:34px;text-align:right" type="number" value="${gf.p}" onchange="setGift(${gf.id},'p',+this.value)" aria-label="Price"></td>
  <td><select class="in" style="width:140px;height:34px" onchange="setGift(${gf.id},'t',this.value)">${["Common","Rare","Legendary"].map(t=>`<option ${gf.t===t?"selected":""}>${t}</option>`).join("")}</select></td>
  <td><button class="sw ${gf.on?"on":""}" role="switch" aria-checked="${!!gf.on}" aria-label="Gift live" onclick="setGift(${gf.id},'on',${gf.on?0:1})"></button></td></tr>`).join("")}</tbody></table></div>`}
function setGift(id,k,v){const gf=D.gifts.find(x=>x.id===id);gf[k]=v;audit("Edited gift",`${gf.nm} · ${k}`);toast("Gift updated")}

/* ---------- growth: campaigns, featured, promos, levels & VIP ---------- */
function vCampaigns(){
 return head("Campaigns","Push notifications and in-app banners. Pick an audience, write the message and schedule it.",`<button class="btn pri" onclick="S.modal=campModal;render()">${I("plus",15)} New campaign</button>`)+
 `<div class="card"><table class="tbl"><thead><tr><th>Campaign</th><th>Type</th><th>Audience</th><th>When</th><th class="num">Sent</th><th>Status</th></tr></thead><tbody>
 ${D.campaigns.map(c=>`<tr><td><b>${esc(c.title)}</b></td><td>${c.type}</td><td>${esc(c.aud)}</td><td>${c.when}</td><td class="num tab">${c.sent}</td>
  <td><button class="pill ${c.st==="Running"?"p-ok":c.st==="Paused"?"p-mute":"p-acc"}" onclick="campToggle(${c.id})" title="Pause or resume"><i></i>${c.st}</button></td></tr>`).join("")}</tbody></table></div>`}
function campToggle(id){const c=D.campaigns.find(x=>x.id===id);c.st=c.st==="Paused"?"Running":"Paused";audit(c.st==="Paused"?"Paused campaign":"Resumed campaign",c.title);render()}
function campModal(){
 return `<div class="modal" role="dialog" aria-label="New campaign"><header><h2>New campaign</h2></header><div class="body">
  <label class="f">Type<select class="in" id="cty"><option>Push</option><option>Banner</option></select></label>
  <label class="f">Audience<select class="in" id="cau"><option>All senders</option><option>All hosts</option><option>Inactive for 7 days</option><option>Low balance (under 100 coins)</option><option>New senders, no recharge yet</option></select></label>
  <label class="f full">Title<input class="in" id="cti" maxlength="50" placeholder="Your favourite host is live"></label>
  <label class="f full">Message<input class="in" id="cms" maxlength="120" placeholder="Tap to join before the queue fills up"></label>
  <label class="f">Send<select class="in" id="cwh"><option>Now</option><option>Tonight, 8:00 pm</option><option>Saturday, 7:00 pm</option></select></label>
  <div class="note">Push messages respect each user's notification settings and quiet hours.</div></div>
  <footer><button class="btn ghost" onclick="S.modal=null;render()">Cancel</button><button class="btn pri" onclick="saveCamp()">Schedule</button></footer></div>`}
function saveCamp(){const v=id=>document.getElementById(id).value;if(!v("cti").trim()){toast("Add a title");return}
 D.campaigns.unshift({id:D.campaigns.length+1,type:v("cty"),title:v("cti"),aud:v("cau"),when:v("cwh"),st:v("cwh")==="Now"?"Running":"Scheduled",sent:v("cwh")==="Now"?"Sending…":"—"});
 audit("Created campaign",v("cti"));S.modal=null;toast("Campaign saved")}
function vFeatured(){const others=D.users.filter(u=>u.role==="Host"&&!D.featured.includes(u.n));
 return head("Featured hosts","Hosts pinned to the top of Home, in this order. Only verified hosts can be featured.")+
 `<div class="grid2"><div class="card sec"><h3>On Home now</h3>${D.featured.map((nm,i)=>`<div class="ver"><b>${i+1}</b><div><div><b>${esc(nm)}</b></div></div>
  <div style="margin-left:auto;display:flex;gap:6px"><button class="btn sm ghost" ${i?"":"disabled"} onclick="moveF(${i},-1)" aria-label="Move up">↑</button><button class="btn sm ghost" ${i<D.featured.length-1?"":"disabled"} onclick="moveF(${i},1)" aria-label="Move down">↓</button><button class="btn sm bad" onclick="D.featured.splice(${i},1);audit('Removed featured host','${esc(nm)}');render()">Remove</button></div></div>`).join("")||`<div class="empty">No featured hosts.</div>`}</div>
 <div class="card sec"><h3>Add a host</h3>${others.map(u=>`<div class="ver"><div><b>${esc(u.n)}</b><span> · ${u.city}</span></div><button class="btn sm" style="margin-left:auto" onclick="D.featured.push('${esc(u.n)}');audit('Featured host','${esc(u.n)}');render()">Feature</button></div>`).join("")}</div></div>`}
function moveF(i,d){const f=D.featured;[f[i],f[i+d]]=[f[i+d],f[i]];render()}
function vPromos(){
 return head("Promo codes","Bonus coins on recharge. Codes stop working at their use limit or expiry date.",`<button class="btn pri" onclick="newPromo()">${I("plus",15)} New code</button>`)+
 `<div class="card"><table class="tbl"><thead><tr><th>Code</th><th class="num">Bonus</th><th class="num">Used</th><th>Expires</th><th>Live</th></tr></thead><tbody>
 ${D.promos.map((p,i)=>`<tr><td class="tab"><b>${p.code}</b></td><td class="num tab">${p.bonus}%</td><td class="num tab">${n(p.used)} / ${n(p.max)}</td><td>${p.exp}</td>
  <td><button class="sw ${p.on?"on":""}" role="switch" aria-checked="${!!p.on}" aria-label="Code live" onclick="D.promos[${i}].on=D.promos[${i}].on?0:1;audit('Toggled promo code','${p.code}');render()"></button></td></tr>`).join("")}</tbody></table></div>`}
function newPromo(){const code="ZIMI"+Math.floor(100+Math.random()*900);D.promos.unshift({code,bonus:25,max:1000,used:0,exp:"30 Nov",on:0});audit("Created promo code",code);toast(`${code} created as paused. Edit it, then switch it on.`)}
function vLevels(){
 return head("Levels & VIP","Draft settings for the next phase. Nothing here is visible in the app until you launch it.",`<span class="pill p-acc" style="height:30px">Draft</span>`)+
 `<div class="grid2"><div class="card"><div class="sec" style="padding-bottom:4px"><h3>Levels</h3></div><table class="tbl"><thead><tr><th>Level</th><th class="num">Coins spent to reach</th><th>Perk</th></tr></thead><tbody>
  ${D.levels.map(([l,c,p])=>`<tr><td><b>Lv ${l}</b></td><td class="num tab">${n(c)}</td><td>${p}</td></tr>`).join("")}</tbody></table></div>
 <div class="card"><div class="sec" style="padding-bottom:4px"><h3>VIP plans</h3></div><table class="tbl"><thead><tr><th>Plan</th><th class="num">Monthly</th><th>Includes</th></tr></thead><tbody>
  ${D.vip.map(([nm,p,inc])=>`<tr><td><b>${nm}</b></td><td class="num tab">₹${n(p)}</td><td>${inc}</td></tr>`).join("")}</tbody></table></div></div>`}

/* ---------- support ---------- */
function vTickets(){const agents=D.team.filter(t=>["Support","Moderator","Super admin","Finance"].includes(t[1])).map(t=>t[0]);
 return head("Support tickets","Every ticket opens the user's full timeline, so one screen answers most questions.")+
 `<div class="card"><table class="tbl"><thead><tr><th>Ticket</th><th>User</th><th>Subject</th><th>Assigned to</th><th>Status</th><th></th></tr></thead><tbody>
 ${D.tickets.map((t,i)=>`<tr><td class="tab">${t.id}<div style="font-size:12px;color:var(--muted)">${t.at}</div></td><td><b>${esc(t.n)}</b></td><td>${esc(t.sub)}</td>
  <td><select class="in" style="height:32px;width:150px" onchange="D.tickets[${i}].who=this.value;audit('Assigned ticket','${t.id} to '+this.value);render()" aria-label="Assign"><option value="">Unassigned</option>${agents.map(a=>`<option ${t.who===a?"selected":""}>${a}</option>`).join("")}</select></td>
  <td><span class="pill ${t.st==="Resolved"?"p-ok":t.st==="Open"?"p-warn":"p-mute"}"><i></i>${t.st}</span></td>
  <td><button class="btn sm" onclick="openTicket(${i})">Open</button></td></tr>`).join("")}</tbody></table></div>`}
function openTicket(i){S.ticket=i;S.drawer=()=>userDrawer(D.tickets[i].n,i);render()}
function openUser(nm){S.ticket=null;S.drawer=()=>userDrawer(nm);render()}
function userDrawer(nm,ti){const u=D.users.find(x=>x.n===nm)||{n:nm,id:"U-"+(30000+nm.length*91),city:"—",role:"Sender",kyc:"—",coins:3200,early:0,reports:0,st:"Active",joined:"2026"};
 const T=[["Today, 6:02 pm","Call","Video call with Noor Sheikh · 14 min · 1,820 coins"],["Today, 5:40 pm","Payment","Recharge ₹499.99 · 1,125 coins"],["Today, 1:12 pm","Gift","Sent Crown (9,999) to Tara Iyer"],
  ["Yesterday","Penalty",u.early>2?"Calls paused 10 min: 3 early endings":"None"],["2 Oct","KYC",u.kyc==="Verified"?"Approved by Arjun Mehta":"Pending review"],["28 Sep","Report",u.reports?"Reported for asking for UPI":"No reports"]];
 const t=ti!=null?D.tickets[ti]:null;
 return `<aside class="drawer" role="dialog" aria-label="${esc(u.n)}"><header>${avatar(u.n,2)}<div><h2>${esc(u.n)}</h2><span style="font-size:12.5px;color:var(--muted)">${u.id} · ${u.role} · ${u.city} · ${u.st}</span></div><button class="x" onclick="S.drawer=null;render()" aria-label="Close">&times;</button></header>
 <div class="body">${t?`<div class="note"><b>${t.id}:</b>&nbsp;${esc(t.sub)}</div>`:""}
  <div class="kpis" style="margin:0"><div class="card kpi"><span>Coins</span><b>${n(u.coins)}</b></div><div class="card kpi"><span>Early endings</span><b>${u.early}</b></div><div class="card kpi"><span>Reports</span><b>${u.reports}</b></div></div>
  <div class="tl"><div class="h4" style="margin-bottom:6px">Timeline</div>${T.map(([w,k,d])=>`<div class="ver"><span class="pill p-mute" style="width:78px;justify-content:center">${k}</span><div><div>${esc(d)}</div><span>${w}</span></div></div>`).join("")}</div>
  ${t?`<label class="f">Reply<select class="in" onchange="document.getElementById('rep').value=this.value"><option value="">Use a saved reply…</option>${CANNED.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label>
   <textarea class="in" id="rep" style="min-height:110px" placeholder="Write a reply" aria-label="Reply"></textarea>`:""}
 </div>
 <footer>${t?`<button class="btn pri" onclick="replyTicket(${ti})">Send and resolve</button><button class="btn ghost" onclick="replyTicket(${ti},1)">Send, keep open</button>`
  :`<button class="btn bad" onclick="banUser('${esc(u.n)}')">Ban account</button><button class="btn ghost" onclick="S.drawer=null;render()">Close</button>`}</footer></aside>`}
function replyTicket(i,keep){const v=(document.getElementById("rep").value||"").trim();if(!v){toast("Write a reply first");return}
 const t=D.tickets[i];t.st=keep?"Waiting on user":"Resolved";if(!t.who)t.who=ME()[0];audit("Replied to ticket",t.id);S.drawer=null;toast(`Reply sent to ${t.n}`)}
function banUser(nm){const u=D.users.find(x=>x.n===nm);if(u)u.st="Banned";audit("Banned user",nm);S.drawer=null;toast(`${nm} banned. Pending payouts are on hold.`)}

function noAccess(){return head("No access",`Your role (${ME()[1]}) can't open this area. Ask a Super admin if you need it.`)}

/* ---------- render ---------- */
const VIEWS={dash:vDash,kyc:vKyc,rewards:vRewards,rules:vRules,payouts:vPayouts,users:vUsers,reports:vReports,team:vTeam,audit:vAudit,
 approvals:vApprovals,live:vLive,refunds:vRefunds,recon:vRecon,packs:vPacks,gifts:vGifts,campaigns:vCampaigns,featured:vFeatured,promos:vPromos,levels:vLevels,tickets:vTickets};
function render(){
 const root=document.getElementById("root");
 if(!VIEWS[S.view])S.view="dash";   /* unknown or removed section: back to the dashboard */
 root.innerHTML=S.auth?shell((can(S.view)?VIEWS[S.view]:noAccess)()):vGate()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:"");
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(S.drawer||S.modal)){S.drawer=null;S.modal=null;render()}});
render();
</script>
</body>
</html>
